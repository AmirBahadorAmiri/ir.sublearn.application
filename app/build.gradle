android {
    namespace = 'ir.sublearn'
    compileSdk 36

    defaultConfig {
        applicationId 'ir.sublearn'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"

        multiDexEnabled = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            multiDexEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation libs.calligraphy3
    implementation libs.viewpump

    implementation libs.rxandroid
    implementation libs.rxjava

    implementation libs.room.runtime
    annotationProcessor libs.androidx.room.compiler
    implementation libs.room.rxjava3

    implementation libs.glide

    implementation libs.circleimageview

    implementation libs.okhttp

    implementation libs.media3.exoplayer
    implementation libs.media3.ui

    implementation libs.dexter

//    implementation 'com.github.welbert6:MaterialStoryView:1.0.15'
//    implementation 'com.github.colourmoon:readmore-textview:v1.0.2'
//    implementation 'com.github.teresaholfeld:Stories:1.1.4'
//    implementation 'com.github.shts:StoriesProgressView:3.0.0'
//    implementation 'com.github.SiddyDevelops:InstaStoryView:1.0.0'

    implementation libs.chip.navigation.bar

}