plugins {
    alias(libs.plugins.android.application)
    id 'androidx.room'
}

android {
    namespace 'ir.sublearn.application'
    compileSdk 36

    room {
        schemaDirectory "$projectDir/schemas"
    }

    defaultConfig {
        applicationId "ir.sublearn.application"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"

        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            multiDexEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation 'io.github.inflationx:calligraphy3:3.1.1'
    implementation 'io.github.inflationx:viewpump:2.1.1'

    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'

    def room_version = '2.8.2'
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-rxjava3:$room_version"

    implementation 'com.github.bumptech.glide:glide:5.0.5'

    implementation 'de.hdodenhof:circleimageview:3.1.0'

    implementation 'com.squareup.okhttp3:okhttp:5.2.1'

    implementation  'com.github.massoudss:waveformSeekBar:5.0.2'
    //noinspection Aligned16KB
    implementation 'com.github.lincollincol:amplituda:2.2.2'

    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-ui:1.8.0"

    implementation 'com.karumi:dexter:6.2.3'

//    implementation 'com.github.welbert6:MaterialStoryView:1.0.15'
//    implementation 'com.github.colourmoon:readmore-textview:v1.0.2'
//    implementation 'com.github.teresaholfeld:Stories:1.1.4'
//    implementation 'com.github.shts:StoriesProgressView:3.0.0'
//    implementation 'com.github.SiddyDevelops:InstaStoryView:1.0.0'

    implementation 'com.github.ismaeldivita:chip-navigation-bar:1.4.0'

}